<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Прогон автопилота</title>
<!-- Дашборд дизайн-прогона. Копируется в .designpilot/ один раз и больше не
     правится: состояние приходит из state.js рядом, снимок внутрь страницы
     вписывает sync.py.

     ── Почему страница выглядит так ──────────────────────────────
     Прошлая версия обрастала блоком на каждое замечание: цель, бригада,
     хроника, «сейчас», восемь этапов, отчёт приёмки. Всё правда, и всё
     сразу — то есть стена, в которой не видно главного.

     Теперь на экране ровно четыре вещи, и порядок не случаен:

       1. СОСТОЯНИЕ  идёт / ждёт вас / сдан — одной строкой
       2. ЦЕЛЬ       одна строка: что должно получиться
       3. КОНВЕЙЕР   восемь этапов; у каждого — кто работал и что вышло.
                     Главный объект страницы: этап, роли на нём, результат
       4. ЧТО ДАЛЬШЕ конкретные действия с исполнителем

     Всё остальное — внутри своего этапа, свёрнуто. Правило: **то, что не
     помогает решить, что делать дальше, на первом экране не стоит.** -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --raised: #fff; --surface: #f4f5f7;
    --line: #e7e9ec; --line-strong: #d3d7dc;
    --text: #12292b; --soft: #40524f; --muted: #5e6b6c;
    --accent: #2f6f66; --accent-quiet: #eef5f3; --accent-line: #bfe0d9;
    --warn: #8a5a20; --warn-quiet: #fbf3e6;
    --danger: #ab4b45; --danger-quiet: #fbefee; --ok: #2f6f66;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #151515; --raised: #1a1a19; --surface: rgba(255,255,255,.05);
      --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.20);
      --text: #f0efec; --soft: #c3c2b7; --muted: #95938c;
      --accent: #69a69c; --accent-quiet: rgba(105,166,156,.14); --accent-line: rgba(105,166,156,.34);
      --warn: #db9300; --warn-quiet: rgba(219,147,0,.14);
      --danger: #ec7e7e; --danger-quiet: rgba(236,126,126,.14); --ok: #69a69c;
    }
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 28px 20px 64px;
         font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased }
  .wrap { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px }
  h1 { margin: 0; font-size: 22px; line-height: 30px; letter-spacing: -.03em; font-weight: 600 }
  h2 { margin: 0 0 10px; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: .07em }
  p { margin: 0 }
  a { color: var(--accent); font-weight: 600; text-decoration: none }
  a:hover { text-decoration: underline; text-underline-offset: 3px }
  ul { margin: 0; padding-left: 18px } li { margin: 3px 0 }
  table { width: 100%; border-collapse: collapse; font-size: 13px }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 8px; white-space: nowrap }
  td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top }
  .muted { color: var(--muted); font-size: 12px }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600;
         background: var(--surface); color: var(--muted); white-space: nowrap }
  .tag.ok { background: var(--accent-quiet); color: var(--accent) }
  .tag.ask { background: var(--warn-quiet); color: var(--warn) }
  .tag.bad { background: var(--danger-quiet); color: var(--danger) }
  .fixed { color: var(--ok) } .open { color: var(--danger) } .ask { color: var(--warn) }

  /* 1. Состояние */
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between }
  .state { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
           font-size: 13px; font-weight: 600; border: 1px solid }
  .state.go { background: var(--accent-quiet); color: var(--accent); border-color: var(--accent-line) }
  .state.wait { background: var(--warn-quiet); color: var(--warn); border-color: var(--warn) }
  .state.done { background: var(--surface); color: var(--soft); border-color: var(--line) }
  .beat { width: 7px; height: 7px; border-radius: 999px; background: currentColor }
  /* Мигание — сменой непрозрачности, а не гало. Гало того же цвета на том же
     фоне не видно вовсе: первая версия «пульсировала» так, что владелец
     спросил, почему ничего не мигает. */
  .state.go .beat { animation: blip 1.15s ease-in-out infinite }
  @keyframes blip { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }

  /* 2. Цель */
  .goal { font-size: 15px; line-height: 23px; color: var(--soft) }
  .goal b { color: var(--text); font-weight: 600 }

  /* 3. Конвейер — главный объект страницы */
  .line { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--raised) }
  details.st { border-top: 1px solid var(--line) }
  details.st:first-child { border-top: 0 }
  details.st > summary { cursor: pointer; list-style: none; padding: 11px 14px;
                         display: grid; grid-template-columns: 18px 118px 1fr auto; gap: 12px; align-items: center }
  details.st > summary::-webkit-details-marker { display: none }
  details.st > summary:hover { background: var(--surface) }
  details.st > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
  details.st[open] > summary { background: var(--surface) }
  .num { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center;
         font-size: 11px; font-weight: 700; background: var(--surface); color: var(--muted) }
  details.st.done .num { background: var(--accent-quiet); color: var(--accent) }
  details.st.active .num { background: var(--accent); color: #fff }
  .st-name { font-size: 14px; font-weight: 600 }
  details.st.pending .st-name, details.st.pending .st-out { color: var(--muted) }
  .st-out { font-size: 13px; color: var(--soft); min-width: 0 }
  .who { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end }
  .who i { font-style: normal; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
           background: var(--surface); color: var(--muted); white-space: nowrap }
  .who i.lead { background: var(--accent); color: #fff }
  /* Роль, которая работает прямо сейчас, — единственное живое место на
     странице. Тихая подсветка этого не говорит: нужен залитый чип и точка,
     которая мигает. Строка конвейера — то место, куда смотрят. */
  .who i.now { background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 5px }
  .who i.now::before { content: ""; width: 5px; height: 5px; border-radius: 999px;
                       background: currentColor; animation: blip 1.15s ease-in-out infinite }
  details.st.active .num { position: relative }
  details.st.active .num::after { content: ""; position: absolute; inset: -3px; border-radius: 999px;
                                  border: 1.5px solid var(--accent); animation: ring 1.9s ease-out infinite }
  @keyframes ring { 0% { opacity: .7; transform: scale(.9) } 100% { opacity: 0; transform: scale(1.35) } }
  .st-body { padding: 2px 14px 16px 44px; display: flex; flex-direction: column; gap: 12px;
             font-size: 13px; border-top: 1px solid var(--line) }
  @media (max-width: 720px) {
    details.st > summary { grid-template-columns: 18px 1fr; gap: 8px }
    .st-out, .who { grid-column: 2 }
    .who { justify-content: flex-start }
    .st-body { padding-left: 14px }
  }

  /* 4. Что дальше */
  .next { border: 1px solid var(--accent-line); border-radius: 12px; background: var(--accent-quiet); padding: 14px 16px }
  .next ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px }
  .next li { font-size: 14px }
  .next .who-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
                   background: var(--accent); color: #fff; margin-right: 6px; vertical-align: 1px }
  .next .who-tag.you { background: var(--warn); color: #fff }
  .done-when { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--accent-line);
               font-size: 13px; color: var(--soft) }

  .links { display: flex; flex-wrap: wrap; gap: 8px }
  .links a { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-size: 13px }
  .links a:hover { border-color: var(--accent); background: var(--accent-quiet); text-decoration: none }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg) }
  .grid2 { display: grid; gap: 10px; grid-template-columns: 1fr; align-items: start }
  @media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr } }
  details.sub > summary { cursor: pointer; list-style: none; font-weight: 600; padding: 4px 0 }
  details.sub > summary::-webkit-details-marker { display: none }
  details.sub > summary::before { content: "› "; color: var(--muted) }
  details.sub[open] > summary::before { content: "⌄ " }
  details.sub > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
  .empty { color: var(--muted) }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<script>/*STATE-BEGIN*/window.STATE=null;/*STATE-END*/</script>
<script src="state.js"></script>

<div class="wrap" id="app"></div>

<script>
const STAGES = [
  ['intake', 'Приём'], ['discovery', 'Разбор'], ['system', 'Система'], ['plan', 'План'],
  ['work', 'Работа'], ['verify', 'Проверка'], ['polish', 'Дизайн-ревью'], ['ship', 'Сдача'],
]
const SHORT = { 'Продуктовый аналитик': 'Аналитик', 'Frontend-разработчик': 'Frontend',
                'Инженер по доступности': 'Доступность', 'UI/UX-дизайнер': 'Дизайнер',
                'Дизайн-ревьюер': 'Дизайн-ревью', 'QA-инженер': 'QA', 'Ведущий': 'Ведущий' }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const plural = (n, a, b, c) => { const x = Math.abs(n) % 10, y = Math.abs(n) % 100
  return (x === 1 && y !== 11) ? a : (x >= 2 && x <= 4 && (y < 12 || y > 14)) ? b : c }
const stageOf = (s, id) => { const v = (s.stages || {})[id]
  return typeof v === 'string' ? { state: v, note: '' } : (v || { state: 'pending', note: '' }) }

/* Кто работал на этапе — выводится из хроники и состава, а не пишется
   вручную: список, который ведут в двух местах, расходится. */
function rolesAt(s, id, curId) {
  const set = new Set()
  ;(s.log || []).forEach((e) => { if (e.stage === id && e.role && SHORT[e.role]) set.add(e.role) })
  ;(s.crew || []).forEach((c) => { if (c.stage === id) set.add(c.role) })
  const working = new Set((s.crew || []).filter((c) => c.state === 'working').map((c) => c.role))
  return [...set].map((r) => {
    const cls = r === 'Ведущий' ? 'lead' : (working.has(r) ? 'now' : '')
    return `<i class="${cls}">${esc(SHORT[r] || r)}</i>`
  }).join('')
}

function body(id, s) {
  const screens = s.screens || [], defects = s.defects || [], recs = s.recommendations || []
  const L = s.links || {}, d = s.discovery || null, imp = s.improvements || []
  const row = (x) => `<tr><td>${esc(x[0])}</td><td class="muted">${esc(x[1])}</td></tr>`

  if (id === 'intake') return `
    <p>${esc(s.scope || '')}</p>
    ${s.offLimits ? `<p class="muted"><b>Не трогаем:</b> ${esc(s.offLimits)}</p>` : ''}
    ${s.source ? `<p class="muted"><b>Вход:</b> ${esc(s.source)}</p>` : ''}`

  if (id === 'discovery') return d ? `
    <p class="muted">${esc(d.note || '')}</p>
    <details class="sub"><summary>Инвентарь исходника — ${(d.blocks || []).length} ${plural((d.blocks || []).length, 'блок', 'блока', 'блоков')}</summary>
      <div class="grid2" style="margin-top:8px">${(d.blocks || []).map((b) => `<div class="box">
        <b>${esc(b.name)}</b><ul style="margin-top:4px">${(b.items || []).map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
      </div>`).join('')}</div></details>` : '<p class="empty">Инвентарь ещё не снят.</p>'

  if (id === 'system') return `
    <p>${esc(s.system || '')}</p>
    ${s.systemNote ? `<p class="muted">${esc(s.systemNote)}</p>` : ''}
    ${L.system ? `<p><a href="${esc(L.system)}" target="_blank" rel="noopener">Открыть систему →</a></p>` : ''}`

  if (id === 'plan') return `
    <table><tbody>${screens.map((x) => row([x.name, (x.tasks || []).length ? `${(x.tasks || []).length} шагов` : 'шаги не записывались'])).join('')}</tbody></table>
    ${s.planNote ? `<p class="muted">${esc(s.planNote)}</p>` : ''}`

  if (id === 'work') {
    const m = screens.find((x) => (x.tasks || []).length)
    return `<table><tbody>${screens.map((x) => row([x.name, x.state === 'done' ? 'готов' : x.state === 'wip' ? 'в работе' : 'ждёт'])).join('')}</tbody></table>
      ${m ? `<details class="sub"><summary>Шаги экрана «${esc(m.name)}» — ${(m.tasks || []).filter((t) => t.state === 'done').length} из ${(m.tasks || []).length}</summary>
        <ul style="margin-top:6px">${m.tasks.map((t) => `<li><span class="${t.state === 'done' ? 'fixed' : 'ask'}">${t.state === 'done' ? '✓' : '•'}</span>
          <b>${esc(t.role || '')}</b> — ${esc(t.text)}</li>`).join('')}</ul></details>` : ''}
      ${m && m.parity ? `<details class="sub"><summary>Сверка с исходником — потеряно ${(m.parity.lost || []).length}</summary>
        <p style="margin-top:6px">Перенесено ${m.parity.kept}. Изменено ${(m.parity.changed || []).length}:</p>
        <ul>${(m.parity.changed || []).map((c) => `<li>${esc(c.what)} <span class="muted">— ${esc(c.why)}</span></li>`).join('')}</ul></details>` : ''}`
  }

  if (id === 'verify') {
    const fixed = defects.filter((x) => x.fixed).length
    const q = s.qaReport
    return `
    <p class="muted">Четыре слоя: словарь (линтер) · числа (аудит) · полнота (сверка) · приёмка (руками).
    Первые три смотрят, ни один не нажимает — поэтому четвёртый и появился.</p>
    ${q ? `<details class="sub"><summary>Приёмка руками — ${q.checked} контролов, ${q.dead} мёртвых</summary>
      <p class="muted" style="margin-top:6px">${esc(q.note || '')}</p>
      <table style="margin-top:6px"><tbody>${(q.rows || []).map((r) => `<tr>
        <td style="white-space:nowrap"><span class="tag ${r.kind === 'Поломка' ? 'bad' : 'ask'}">${esc(r.kind)}</span></td>
        <td>${esc(r.what)}<br /><span class="muted">${esc(r.detail)}</span></td></tr>`).join('')}</tbody></table></details>` : ''}
    ${defects.length ? `<details class="sub"><summary>Дефекты — ${fixed} из ${defects.length} починено</summary>
      <ul style="margin-top:6px">${defects.map((x) => `<li><span class="${x.fixed ? 'fixed' : 'open'}">${x.fixed ? '✓' : '•'}</span> ${esc(x.text)}</li>`).join('')}</ul></details>` : ''}`
  }

  if (id === 'polish') return `
    <p class="muted">Кругов два: правки первого круга сами создают дефекты, а первый проход снимает верхний слой.</p>
    ${imp.length ? `<ul>${imp.map((i) => `<li><span class="${i.state === 'done' ? 'fixed' : i.state === 'skip' ? 'muted' : 'ask'}">${i.state === 'done' ? '✓' : i.state === 'skip' ? '–' : '•'}</span>
      <b>${esc(i.role || '')}</b> — ${esc(i.text)}</li>`).join('')}</ul>` : '<p class="empty">Проход ещё не запускался.</p>'}
    ${recs.length ? `<details class="sub"><summary>Найдено вне объёма — ${recs.filter((r) => r.status === 'open').length} без ответа</summary>
      <table style="margin-top:6px"><tbody>${recs.map((r) => `<tr><td>${esc(r.text)}<br /><span class="muted">${esc(r.proposal || '')}</span></td>
        <td style="white-space:nowrap">${r.status === 'accepted' ? '<span class="tag ok">взято</span>'
          : r.status === 'declined' ? '<span class="tag">отклонено</span>' : '<span class="tag ask">ждёт</span>'}</td></tr>`).join('')}</tbody></table></details>` : ''}`

  if (id === 'ship') return `
    <div class="links">
      ${L.prototype ? `<a href="${esc(L.prototype)}" target="_blank" rel="noopener">Прототип →</a>` : ''}
      ${L.system ? `<a href="${esc(L.system)}" target="_blank" rel="noopener">Дизайн-система →</a>` : ''}
      ${L.artifact ? `<a href="${esc(L.artifact)}" target="_blank" rel="noopener">Артефакт →</a>` : ''}
      ${L.source ? `<a href="${esc(L.source)}" target="_blank" rel="noopener">Исходник →</a>` : ''}
    </div>
    ${s.shipNote ? `<p class="muted">${esc(s.shipNote)}</p>` : ''}`
  return ''
}

let lastJSON = null, painted = false

function render(force) {
  const s = window.STATE, app = document.getElementById('app')
  if (!s) { app.innerHTML = '<p class="empty">Состояние ещё не записано.</p>'; return }
  const json = JSON.stringify(s)
  if (!force && json === lastJSON) return
  lastJSON = json
  const open = new Set([...app.querySelectorAll('details[open]')].map((d) => d.dataset.key))
  const y = window.scrollY, first = !painted

  const openQ = (s.questions || []).filter((q) => !q.answered)
  const openRecs = (s.recommendations || []).filter((r) => r.status === 'open')
  const working = (s.crew || []).filter((c) => c.state === 'working' && c.role !== 'Ведущий')
  const idx = STAGES.findIndex(([id]) => stageOf(s, id).state === 'active')
  const curI = idx < 0 ? Math.max(0, STAGES.findIndex(([id]) => stageOf(s, id).state !== 'done')) : idx
  const curId = STAGES[curI] ? STAGES[curI][0] : 'ship'

  const state = s.finishedAt
    ? ['done', 'Прогон сдан']
    : working.length ? ['go', `Работает ${working.map((c) => SHORT[c.role] || c.role).join(', ')}`]
    : (openQ.length + openRecs.length) ? ['wait', `Ждёт вас — ${openQ.length + openRecs.length} ${plural(openQ.length + openRecs.length, 'решение', 'решения', 'решений')}`]
    : ['go', 'Идёт работа']

  /* Действия собираются из состояния, а не пишутся руками: список, который
     ведут отдельно, устаревает первым. */
  const steps = []
  if (openQ.length) steps.push(['you', `Ответить на ${openQ.length} ${plural(openQ.length, 'вопрос', 'вопроса', 'вопросов')}: ${openQ.map((q) => esc(q.text)).join('; ')}`])
  if (openRecs.length) steps.push(['you', `Решить по ${openRecs.length} ${plural(openRecs.length, 'находке', 'находкам', 'находкам')} вне объёма — этап «Дизайн-ревью»`])
  ;(s.next || []).forEach((n) => steps.push([n.who === 'вы' ? 'you' : 'lead', esc(n.what)]))

  app.innerHTML = `
    <div class="top">
      <h1>${esc(s.run || 'Прогон')}</h1>
      <span class="state ${state[0]}"><span class="beat"></span>${esc(state[1])}</span>
    </div>

    ${s.goal ? `<p class="goal"><b>Цель:</b> ${esc(s.goal)}</p>` : ''}

    <section>
      <h2>Конвейер — этап ${curI + 1} из ${STAGES.length}</h2>
      <div class="line">${STAGES.map(([id, name], i) => {
        const st = stageOf(s, id)
        /* Раскрыт при первой отрисовке ровно один этап — текущий. Два
           раскрытых «активных» снова превращают страницу в стену. */
        return `<details class="st ${st.state}" data-key="st:${id}"${id === curId && first ? ' open' : ''}>
          <summary>
            <span class="num">${st.state === 'done' ? '✓' : i + 1}</span>
            <span class="st-name">${name}</span>
            <span class="st-out">${esc(st.note || '')}</span>
            <span class="who">${rolesAt(s, id, curId)}</span>
          </summary>
          <div class="st-body">${body(id, s) || '<p class="empty">Этап ещё не начат.</p>'}</div>
        </details>`
      }).join('')}</div>
    </section>

    ${steps.length || s.doneWhen ? `<section>
      <h2>Что дальше</h2>
      <div class="next">
        ${steps.length ? `<ol>${steps.map(([who, what]) => `<li><span class="who-tag ${who === 'you' ? 'you' : ''}">${who === 'you' ? 'вы' : 'ведущий'}</span>${what}</li>`).join('')}</ol>`
          : '<p>Действий за вами нет.</p>'}
        ${s.doneWhen ? `<p class="done-when"><b>Готово, когда:</b> ${esc(s.doneWhen)}</p>` : ''}
      </div>
    </section>` : ''}

    ${(s.links && s.links.prototype) ? `<div class="links">
      ${s.links.prototype ? `<a href="${esc(s.links.prototype)}" target="_blank" rel="noopener">Прототип →</a>` : ''}
      ${s.links.system ? `<a href="${esc(s.links.system)}" target="_blank" rel="noopener">Дизайн-система →</a>` : ''}
      ${s.links.artifact ? `<a href="${esc(s.links.artifact)}" target="_blank" rel="noopener">Артефакт →</a>` : ''}
      ${s.links.source ? `<a href="${esc(s.links.source)}" target="_blank" rel="noopener">Исходник →</a>` : ''}
    </div>` : ''}

    ${(s.crew || []).length ? `<details class="sub" data-key="crew"><summary>Кто есть кто — ${(s.crew || []).length} ${plural((s.crew || []).length, 'роль', 'роли', 'ролей')}</summary>
      <table style="margin-top:8px">
        <thead><tr><th>Роль</th><th>Что делает</th><th>Модель</th><th>Как</th><th>Почему эта модель</th></tr></thead>
        <tbody>${s.crew.map((c) => `<tr>
        <td style="white-space:nowrap"><b>${esc(c.role)}</b>${c.lead ? ' <span class="tag ok">ведёт</span>' : ''}</td>
        <td class="muted">${esc(c.does || '')}</td>
        <td style="white-space:nowrap"><span class="tag">${esc(c.model)}</span></td>
        <td class="muted" style="white-space:nowrap">${esc(c.how || '')}</td>
        <td class="muted">${esc(c.why || '')}</td></tr>`).join('')}</tbody></table>
      ${s.crewNote ? `<p class="muted" style="margin-top:8px">${esc(s.crewNote)}</p>` : ''}</details>` : ''}

    ${(s.log || []).length ? `<details class="sub" data-key="log"><summary>Хроника — ${s.log.length} ${plural(s.log.length, 'событие', 'события', 'событий')}</summary>
      <table style="margin-top:8px"><tbody>${[...s.log].reverse().map((e) => `<tr>
        <td style="white-space:nowrap" class="muted">${esc((STAGES.find(([i]) => i === e.stage) || [, ''])[1])}</td>
        <td><b>${esc(e.role || '')}</b> ${esc(e.text)}${e.back ? ' <span class="tag">восстановлено</span>' : ''}</td></tr>`).join('')}</tbody></table></details>` : ''}
  `

  app.querySelectorAll('details').forEach((d) => { if (open.has(d.dataset.key)) d.open = true })
  if (y) window.scrollTo({ top: y, behavior: 'auto' })
  painted = true
}

render(true)
setInterval(() => {
  const el = document.createElement('script')
  el.src = 'state.js?t=' + Date.now()
  el.onload = () => { render(); el.remove() }
  el.onerror = () => el.remove()
  document.body.appendChild(el)
}, 10000)
</script>
